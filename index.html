    <footer class="site-footer">

        </div>

        <button type="button" id="music-toggle" class="music-btn" aria-label="Toggle Music">
            <span id="music-icon">▶</span>
            <span id="music-label">Music: OFF</span>
        </button>
    </div>
</footer>
<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<script>
    // 1. MUSIQA BOSHQARUVI
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-toggle');
    const musicIcon = document.getElementById('music-icon');
    const musicLabel = document.getElementById('music-label');

    musicBtn.addEventListener('click', () => {
        if (music.paused) {
            music.play().then(() => {
                musicIcon.textContent = '❚❚';
                musicLabel.textContent = 'Music: ON';
                musicBtn.classList.add('playing');
            }).catch(() => {
                musicLabel.textContent = 'Check music.mp3';
            });
        } else {
            music.pause();
            musicIcon.textContent = '▶';
            musicLabel.textContent = 'Music: OFF';
            musicBtn.classList.remove('playing');
        }
    });

    // 2. TASHRIF BUYURUVCHILAR HISOBLAGICHI
    // Eslatma: Local fayl/brauzerda test qilish uchun localStorage ishlaydi.
    // Saytni hostingga qo'ygach, haqiqiy umumiy hisoblagich uchun CounterAPI yoki backend ulash mumkin.
    const counterEl = document.getElementById('visitor-count');
    let count = Number(localStorage.getItem('eshonqulov_visits') || 0) + 1;
    localStorage.setItem('eshonqulov_visits', count);
    counterEl.textContent = count.toLocaleString();
</script>
